services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: dispatch
      POSTGRES_USER: dispatch
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set a strong database password in .env}
    volumes:
      - dispatch_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispatch -d dispatch"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    ports:
      - "127.0.0.1:5080:8080"
    environment:
      ConnectionStrings__Dispatch: Host=db;Database=dispatch;Username=dispatch;Password=${DB_PASSWORD}
      MigrateOnStart: "true"
      BootstrapEmail: ${BOOTSTRAP_EMAIL:-admin@electrogroup.test}
      BootstrapPassword: ${BOOTSTRAP_PASSWORD:?Set an initial administrator password in .env}
      BootstrapMdPassword: ${BOOTSTRAP_MD_PASSWORD:?Set a different MD password in .env}
      ASPNETCORE_ENVIRONMENT: Production
    depends_on:
      db:
        condition: service_healthy
volumes:
  dispatch_data:
